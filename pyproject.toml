[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprix-agent-spectra"
version = "0.1.0"
description = "Evidence-calibrated adaptive capability profiling for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Sprix AI at Yuzhi Tongxing"},
  {name = "Yichen Wang"},
  {name = "Yonghao Zhang"},
]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spectra-demo = "sprix_spectra.cli:main"
spectra-benchmark = "sprix_spectra.experiment:main"

[project.urls]
Homepage = "https://github.com/wang2122/sprix-agent-spectra"
Repository = "https://github.com/wang2122/sprix-agent-spectra"
Issues = "https://github.com/wang2122/sprix-agent-spectra/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
