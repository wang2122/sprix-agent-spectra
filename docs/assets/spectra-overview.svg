<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">SPECTRA adaptive agent evaluation overview</title>
  <desc id="desc">A five-stage loop from calibrated item bank through adaptive selection and agent execution to a hash-chained evidence ledger and multidimensional capability posterior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="profile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a7f78"/>
      <stop offset="1" stop-color="#245b73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#517087"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a7f78"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .subtitle { font: 400 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #617687; }
      .step { font: 700 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #2a7f78; }
      .heading { font: 700 19px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b6172; }
      .small { font: 500 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #617687; }
      .formula { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #245b73; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1400" height="650" rx="24" fill="url(#bg)"/>
  <text x="700" y="54" text-anchor="middle" class="title">SPECTRA: Adaptive Evidence-Calibrated Agent Profiling</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">Select the most informative next trial, preserve the evidence, and report uncertainty—not just a pass rate.</text>

  <g filter="url(#shadow)">
    <rect x="45" y="135" width="225" height="320" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
    <rect x="305" y="135" width="230" height="320" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
    <rect x="570" y="135" width="220" height="320" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
    <rect x="825" y="135" width="235" height="320" rx="18" fill="#ffffff" stroke="#d8e2e8"/>
    <rect x="1095" y="135" width="260" height="320" rx="18" fill="url(#profile)"/>
  </g>

  <g>
    <text x="70" y="171" class="step">01 · CALIBRATE</text>
    <text x="70" y="204" class="heading">Versioned item bank</text>
    <rect x="70" y="228" width="175" height="46" rx="9" fill="#eef6f5" stroke="#b8d8d3"/>
    <text x="83" y="248" class="small">Research synthesis</text>
    <text x="83" y="265" class="formula">a=1.42  ·  b=0.35</text>
    <rect x="70" y="286" width="175" height="46" rx="9" fill="#f2f5f8" stroke="#cad6de"/>
    <text x="83" y="306" class="small">Tool recovery</text>
    <text x="83" y="323" class="formula">a=1.18  ·  b=0.72</text>
    <rect x="70" y="344" width="175" height="77" rx="9" fill="#fff9ed" stroke="#ead6a5"/>
    <text x="83" y="365" class="small">Item metadata</text>
    <text x="83" y="385" class="body">Q-vector · cost · latency</text>
    <text x="83" y="404" class="body">safety · contamination</text>
  </g>

  <g>
    <text x="330" y="171" class="step">02 · SELECT</text>
    <text x="330" y="204" class="heading">Cost-aware EIG policy</text>
    <circle cx="420" cy="286" r="61" fill="#eef6f5" stroke="#85bdb5" stroke-width="2"/>
    <circle cx="420" cy="286" r="40" fill="none" stroke="#2a7f78" stroke-width="10" stroke-dasharray="75 180" transform="rotate(-90 420 286)"/>
    <path d="M420 286 L455 249" stroke="#c89b3c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="420" cy="286" r="6" fill="#17324d"/>
    <text x="420" y="374" text-anchor="middle" class="formula">½ log det(I + ΣFᵢ)</text>
    <text x="420" y="398" text-anchor="middle" class="small">+ coverage + repeats</text>
    <text x="420" y="418" text-anchor="middle" class="small">− cost − contamination</text>
  </g>

  <g>
    <text x="595" y="171" class="step">03 · EXECUTE</text>
    <text x="595" y="204" class="heading">Agent trial</text>
    <rect x="619" y="236" width="122" height="90" rx="15" fill="#f2f5f8" stroke="#9db2c1" stroke-width="2"/>
    <circle cx="650" cy="273" r="13" fill="#2a7f78"/>
    <circle cx="710" cy="273" r="13" fill="#2a7f78"/>
    <path d="M646 304 Q680 324 714 304" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <path d="M680 236 V217 M661 223 H699" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <rect x="598" y="351" width="165" height="70" rx="10" fill="#eef6f5" stroke="#b8d8d3"/>
    <text x="680" y="374" text-anchor="middle" class="body">Task + tools + policy</text>
    <text x="680" y="396" text-anchor="middle" class="body">Fixed environment version</text>
  </g>

  <g>
    <text x="850" y="171" class="step">04 · RECORD</text>
    <text x="850" y="204" class="heading">Evidence ledger</text>
    <rect x="858" y="232" width="168" height="55" rx="9" fill="#f2f5f8" stroke="#cad6de"/>
    <text x="874" y="254" class="small">#031 · score 0.82</text>
    <text x="874" y="274" class="formula">hash 7a91…d30c</text>
    <path d="M942 287 V305" stroke="#517087" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="858" y="312" width="168" height="55" rx="9" fill="#eef6f5" stroke="#85bdb5"/>
    <text x="874" y="334" class="small">#032 · violation 0</text>
    <text x="874" y="354" class="formula">hash b49f…20e1</text>
    <path d="M942 367 V385" stroke="#517087" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="858" y="392" width="168" height="31" rx="9" fill="#fff9ed" stroke="#ead6a5"/>
    <text x="942" y="413" text-anchor="middle" class="small">signed root hash</text>
  </g>

  <g>
    <text x="1120" y="171" class="step white">05 · INFER &amp; REPORT</text>
    <text x="1120" y="204" class="heading white">Capability posterior</text>
    <g transform="translate(1225 296)">
      <circle r="70" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.34"/>
      <circle r="47" fill="none" stroke="#ffffff" stroke-opacity="0.24"/>
      <circle r="24" fill="none" stroke="#ffffff" stroke-opacity="0.20"/>
      <path d="M0 -70 L0 70 M-70 0 L70 0 M-49 -49 L49 49 M49 -49 L-49 49" stroke="#ffffff" stroke-opacity="0.22"/>
      <polygon points="0,-53 39,-39 55,0 27,27 0,62 -31,31 -41,0 -34,-34" fill="#79d2c7" fill-opacity="0.48" stroke="#b8fff4" stroke-width="2"/>
    </g>
    <text x="1120" y="390" class="body white">• ability + 95% interval</text>
    <text x="1120" y="413" class="body white">• reliability · calibration · safety</text>
    <text x="1120" y="436" class="body white">• efficiency · drift · evidence count</text>
  </g>

  <path d="M270 295 H298" stroke="#517087" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M535 295 H563" stroke="#517087" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M790 295 H818" stroke="#517087" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1060 295 H1088" stroke="#517087" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M1225 467 C1225 555 420 566 420 475" fill="none" stroke="#2a7f78" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-teal)"/>
  <rect x="652" y="521" width="300" height="42" rx="21" fill="#ffffff" stroke="#b8d8d3"/>
  <text x="802" y="547" text-anchor="middle" class="body">Posterior uncertainty guides the next trial</text>

  <text x="700" y="620" text-anchor="middle" class="small">Figure 1 · SPECTRA closes the loop between calibrated measurement, adaptive experimentation, and auditable evidence.</text>
</svg>
